name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Fast checks that run anywhere: the brain's tests, clippy, the front end,
  # and a type-check of every Windows API call (scripts/wincheck.sh).
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Linux webview libraries (for type-checking the Tauri app)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev
      - run: npm ci
      - run: npm run build
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings
      - run: ./scripts/wincheck.sh

  # The real thing: builds dosctl.exe and the Windows installer.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: cargo test -p dos-core
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build installer
        run: npm run pack
      - uses: actions/upload-artifact@v4
        with:
          name: DosLive-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/dosctl.exe
          if-no-files-found: error
